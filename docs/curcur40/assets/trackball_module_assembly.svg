<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">curcur40 トラックボールモジュールの組み立て図</title>
  <desc id="desc">ボール、3個の支持球、カップ、レンズ付きPMW3360センサー基板の断面模式図、組み立て手順、6ピン接続対応表。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#475569"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Yu Gothic", "Meiryo", sans-serif; fill: #172033; }
      .title { font-size: 32px; font-weight: 700; }
      .heading { font-size: 23px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 600; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .label.light, .small.light { fill: #fff; }
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .leader { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .wire { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#blueArrow); }
    </style>
  </defs>

  <rect width="1440" height="1120" fill="#f1f5f9"/>
  <text x="48" y="58" class="title">トラックボールモジュールの組み立て</text>
  <text x="50" y="91" class="body" fill="#475569">位置関係を示す模式図です（縮尺・実際の形状とは異なります）。部品の向きは本文の説明も確認してください。</text>

  <rect x="40" y="120" width="790" height="680" rx="18" class="panel"/>
  <text x="68" y="160" class="heading">完成時の断面イメージ</text>
  <text x="68" y="188" class="small" fill="#64748b">ボール側が上。断面には支持球3個のうち2個を表示しています。</text>

  <!-- Right case and the cup form a cradle above the sensor board. -->
  <path d="M145 650 V722 H725 V650" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
  <text x="365" y="755" class="label">右手ケース</text>
  <path d="M235 478 L285 570 Q300 596 335 596 H535 Q570 596 585 570 L635 478"
        fill="#cbd5e1" stroke="#475569" stroke-width="5"/>
  <path d="M260 520 L302 580 H568 L610 520" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <text x="618" y="455" class="small">トラックボールカップ</text>
  <path d="M615 462 L589 501" class="leader"/>

  <!-- Ball and bearings -->
  <circle cx="435" cy="350" r="145" fill="#ef4444" stroke="#991b1b" stroke-width="5"/>
  <path d="M335 300 Q435 235 535 300" fill="none" stroke="#fca5a5" stroke-width="10" opacity=".65"/>
  <text x="435" y="355" class="label light" text-anchor="middle">25 mm 球</text>
  <circle cx="320" cy="492" r="14" fill="#f8fafc" stroke="#475569" stroke-width="4"/>
  <circle cx="550" cy="492" r="14" fill="#f8fafc" stroke="#475569" stroke-width="4"/>
  <path d="M435 500 L435 514" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- Sensor, lens, and optical path -->
  <rect x="294" y="618" width="282" height="24" rx="3" fill="#166534" stroke="#14532d" stroke-width="3"/>
  <text x="435" y="637" class="small light" text-anchor="middle">PMW3360 基板</text>
  <path d="M410 617 L418 592 Q435 576 452 592 L460 617Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <path d="M435 575 V430" stroke="#60a5fa" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="435" y="415" class="small" text-anchor="middle" fill="#1d4ed8">光学経路</text>
  <text x="621" y="565" class="small">LM19-LSI レンズ</text>
  <path d="M615 570 L460 600" class="leader"/>

  <!-- Mechanical fasteners -->
  <path d="M325 590 V617 M545 590 V617" stroke="#334155" stroke-width="5"/>
  <circle cx="325" cy="602" r="6" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <circle cx="545" cy="602" r="6" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <rect x="62" y="224" width="212" height="92" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="80" y="254" class="label">① 支持球を圧入</text>
  <text x="80" y="282" class="small">カップ内側の3つの窪み</text>
  <text x="80" y="304" class="small">に2 mm球を1個ずつ入れる</text>
  <path d="M266 302 L310 468" class="leader"/>

  <rect x="592" y="242" width="205" height="104" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="610" y="273" class="label">② 球を載せる</text>
  <text x="610" y="300" class="small">3つの支持球で回転を</text>
  <text x="610" y="322" class="small">支える（引っかかり確認）</text>
  <path d="M612 350 L568 469" class="leader"/>

  <rect x="66" y="690" width="235" height="76" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="84" y="720" class="label">③ レンズを上向きに</text>
  <text x="84" y="746" class="small">中央穴から球を読み取る</text>
  <path d="M301 704 L401 612" class="leader"/>

  <rect x="850" y="120" width="550" height="390" rx="18" class="panel"/>
  <text x="878" y="160" class="heading">組み立て順</text>
  <circle cx="902" cy="210" r="20" fill="#f97316"/><text x="902" y="217" class="label" text-anchor="middle" fill="#fff">1</text>
  <text x="936" y="207" class="label">カップに支持球を3個圧入</text>
  <text x="936" y="234" class="body">球を仮置きして、滑らかに回るか確認。</text>
  <circle cx="902" cy="292" r="20" fill="#2563eb"/><text x="902" y="299" class="label" text-anchor="middle" fill="#fff">2</text>
  <text x="936" y="288" class="label">センサー基板をカップ底面へ</text>
  <text x="936" y="315" class="body">B.Cu／レンズ側をボール側へ向け、</text>
  <text x="936" y="341" class="body">中央穴にレンズを合わせてM2ネジ2本。</text>
  <circle cx="902" cy="394" r="20" fill="#16a34a"/><text x="902" y="401" class="label" text-anchor="middle" fill="#fff">3</text>
  <text x="936" y="390" class="label">カップを右ケースに固定</text>
  <text x="936" y="417" class="body">M2ネジ2本で固定し、J1とrJ3を接続。</text>
  <text x="936" y="452" class="small" fill="#475569">配線を挟まないようケースへ収めてから</text>
  <text x="936" y="475" class="small" fill="#475569">最後に25 mm球を載せます。</text>
  <rect x="850" y="575" width="550" height="240" rx="18" class="panel"/>
  <text x="878" y="615" class="heading">rJ3 ↔ J1：6ピン接続</text>
  <text x="878" y="641" class="small">Pin 1（四角ランド）同士を合わせる</text>
  <text x="878" y="674" class="label">右メイン基板 rJ3</text>
  <text x="878" y="726" class="label">センサー基板 J1</text>
  <g class="small" text-anchor="middle">
    <rect x="1070" y="648" width="48" height="42" rx="5" fill="#dbeafe" stroke="#64748b"/>
    <rect x="1122" y="648" width="48" height="42" rx="5" fill="#dbeafe" stroke="#64748b"/>
    <rect x="1174" y="648" width="48" height="42" rx="5" fill="#dbeafe" stroke="#64748b"/>
    <rect x="1226" y="648" width="48" height="42" rx="5" fill="#dbeafe" stroke="#64748b"/>
    <rect x="1278" y="648" width="48" height="42" rx="5" fill="#dbeafe" stroke="#64748b"/>
    <rect x="1330" y="648" width="48" height="42" rx="5" fill="#dbeafe" stroke="#64748b"/>
    <text x="1094" y="674">1 ■</text><text x="1146" y="674">2</text><text x="1198" y="674">3</text>
    <text x="1250" y="674">4</text><text x="1302" y="674">5</text><text x="1354" y="674">6</text>
    <path d="M1094 692 V706 M1146 692 V706 M1198 692 V706 M1250 692 V706 M1302 692 V706 M1354 692 V706"
          stroke="#64748b" stroke-width="2"/>
    <rect x="1070" y="706" width="48" height="42" rx="5" fill="#dcfce7" stroke="#64748b"/>
    <rect x="1122" y="706" width="48" height="42" rx="5" fill="#dcfce7" stroke="#64748b"/>
    <rect x="1174" y="706" width="48" height="42" rx="5" fill="#dcfce7" stroke="#64748b"/>
    <rect x="1226" y="706" width="48" height="42" rx="5" fill="#dcfce7" stroke="#64748b"/>
    <rect x="1278" y="706" width="48" height="42" rx="5" fill="#dcfce7" stroke="#64748b"/>
    <rect x="1330" y="706" width="48" height="42" rx="5" fill="#dcfce7" stroke="#64748b"/>
    <text x="1094" y="732">1 ■</text><text x="1146" y="732">2</text><text x="1198" y="732">3</text>
    <text x="1250" y="732">4</text><text x="1302" y="732">5</text><text x="1354" y="732">6</text>
  </g>
  <text x="878" y="773" class="small">GND · 3.3V · CS · MISO · MOSI · SCLK（順にPin 1〜6）</text>
  <text x="878" y="798" class="small" fill="#64748b">J1のPin 7（MOTION）・Pin 8（RESET）は未接続です。</text>

  <rect x="40" y="825" width="1360" height="250" rx="18" class="panel"/>
  <text x="68" y="866" class="heading">向きの要点</text>
  <g class="body">
    <circle cx="82" cy="913" r="6" fill="#2563eb"/>
    <text x="102" y="920">センサー基板は、レンズ側のB.Cu面をボールへ向けます。</text>
    <circle cx="82" cy="959" r="6" fill="#2563eb"/>
    <text x="102" y="966">レンズはカップ中央の開口に通し、PMW3360とボールの間に障害物を置きません。</text>
    <circle cx="82" cy="1005" r="6" fill="#2563eb"/>
    <text x="102" y="1012">接続時はJ1・rJ3それぞれの四角パッド（Pin 1）を見つけ、同じ番号同士を接続します。</text>
  </g>
  <text x="68" y="1050" class="small" fill="#64748b">※ケース／カップへのネジ穴位置、締結順は実物の部品とビルドガイド本文を参照してください。</text>
</svg>
